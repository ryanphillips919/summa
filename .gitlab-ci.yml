stages:
  - test

linux_go_build_and_test:
  stage: test
  image: golang:1.27-bookworm
  tags:
    - docker
  variables:
    SUMMA_ANALYTICS_PYTHON: /tmp/summa-analytics-venv/bin/python
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-venv
    - python3 --version
    - python3 -m venv /tmp/summa-analytics-venv
    - /tmp/summa-analytics-venv/bin/python -m pip install -r analytics/requirements.txt
  script:
    - go version
    - |
      unformatted="$(gofmt -l .)"
      if [ -n "$unformatted" ]; then
        echo "$unformatted"
        exit 1
      fi
    - go vet ./...
    - go test ./...
    - go build ./...
